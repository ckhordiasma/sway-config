icons_format = "{icon}"

[theme]
theme = "dracula"
# [theme.overrides]
# idle_bg = "#123456"
# idle_fg = "#abcdef"

[icons]
icons = "material-nf"
[icons.overrides]
backlight = ["󰃚","󰃛","󰃜","󰃝","󰃞","󰃟","󰃠"]
# bat = ["|E|", "|_|", "|=|", "|F|"]
# bat_charging = "|^| "

# Networking Blocks
[[block]]
block = "net"
device = "tun0"
format = " $device: $speed_down.eng(width:4,p:K,prefix_space:true) " 
inactive_format = ""
missing_format = ""
[block.theme_overrides]
idle_bg = "#223456DD"

# [[block]]
# block = "net"
# if_command = "tailscale status --json | jq -r '.BackendState' | grep -q 'Running'"
# device = "tailscale0"
# format = " $device: $speed_down.eng(width:4,p:K,prefix_space:true) " 
# inactive_format = ""
# missing_format = ""

[[block]]
block = "custom"
hide_when_empty = true
command = '''
if tailscale status --json | jq -r '.BackendState' | grep -q 'Running'; then
    # Get tailscale interface stats
    IFACE=$(ip -o link show | grep tailscale | awk -F': ' '{print $2}')
    if [ -n "$IFACE" ]; then
        # You can use vnstat, ifstat, or parse /sys/class/net for speed
        echo " $IFACE: active"
    fi 
fi
'''
interval = 5
[block.theme_overrides]
idle_bg = "#523456DD"

[[block]]
block = "net"
device = "wlan0"
format = " $icon  $ssid $ip $speed_down.eng(width:4,p:K,prefix_space:true) " 
interval = 5
[block.theme_overrides]
idle_bg = "#123456DD"

[[block]]
block = "battery"
driver = "upower"
charging_format = " $icon $percentage "
full_format = " $icon  $percentage "
[block.theme_overrides]
idle_bg = "#128934DD"

[[block]]
block = "custom"
command = "cccc"
interval = 5
[block.theme_overrides]
idle_bg = "#FF7700DD"
idle_fg = "#FFFFFF"

[[block]]
block = "cpu"
interval = 5
info_cpu = 50
warning_cpu = 75
critical_cpu = 90
format = " $icon $utilization $barchart "

[[block]]
block = "memory"
#format = " $icon $mem_total_used_percents.eng(w:2) $mem_total_used_percents.bar(w:1,v:true) "
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "sound"
format = " $icon $active_port $volume "
driver = "pulseaudio"
show_volume_when_muted = true
headphones_indicator = true
[[block.click]]
button = "left"
cmd = "pactl set-sink-mute @DEFAULT_SINK@ toggle"
[block.theme_overrides]
warning_bg = "#FF3456DD"
idle_bg = "#333456"

[[block]]
block = "backlight"
format = " $icon  $brightness "
root_scaling = 3
[[block.click]]
button = "left"
cmd = ""
[block.theme_overrides]
idle_bg = "#565656"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
